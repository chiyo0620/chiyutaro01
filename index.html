<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ちゆたろうゲームセンター</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
    }
    .font-title {
      font-family: 'Mochiy Pop One', cursive;
    }
    /* ネオン輝きアニメーション */
    @keyframes neon-glow {
      0%, 100% {
        text-shadow: 0 0 10px rgba(236, 72, 153, 0.8), 0 0 20px rgba(236, 72, 153, 0.5), 0 0 40px rgba(168, 85, 247, 0.4);
      }
      50% {
        text-shadow: 0 0 15px rgba(236, 72, 153, 1), 0 0 30px rgba(236, 72, 153, 0.8), 0 0 60px rgba(168, 85, 247, 0.6);
      }
    }
    .neon-text {
      animation: neon-glow 2.5s infinite ease-in-out;
    }
    /* 背景のグリッドアニメーション */
    .bg-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between bg-grid relative overflow-x-hidden selection:bg-pink-500 selection:text-white">

  <!-- 背景デコレーション光彩 -->
  <div class="fixed top-[-10%] left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-gradient-to-r from-pink-600/20 via-purple-600/30 to-indigo-600/20 blur-[120px] pointer-events-none rounded-full"></div>

  <!-- ヘッダーエリア -->
  <header class="pt-12 pb-6 px-4 text-center relative z-10">

      <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      ARCADE PORTAL
    </div>
    <h1 class="font-title text-4xl sm:text-6xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-fuchsia-300 to-indigo-300 neon-text">
      ちゆたろうゲームセンター
    </h1>
    <p class="text-slate-400 mt-3 text-sm sm:text-base font-bold">
      タップまたはクリックしてゲームをはじめよう！
    </p>
  </header>

  <!-- ゲームセレクトエリア -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 relative z-10 flex flex-col justify-center">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8">

        <!-- カード内装飾グラデーション -->
        <div class="absolute -right-12 -top-12 w-40 h-40 bg-cyan-500/10 rounded-full blur-2xl group-hover:bg-cyan-500/20 transition-all"></div>

          <span class="px-3 py-1 rounded-xl bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 text-xs font-black tracking-wider uppercase">
            GAME 01
          </span>
          <span class="text-2xl group-hover:scale-125 transition-transform duration-300">🎯</span>
        </div>

        <div class="my-4 text-center">
          <div class="w-20 h-20 mx-auto mb-4 rounded-2xl bg-cyan-950/60 border border-cyan-500/40 flex items-center justify-center text-4xl shadow-inner group-hover:rotate-6 transition-transform">

            フリーハンドで真円を目指せ！美しさと丸みを極限まで追求するスコアアタックゲーム。
          </p>
        </div>
