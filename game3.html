<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>音色探偵 - 楽器当てゲーム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Zen Maru Gothic', sans-serif; user-select: none; }
    .font-title { font-family: 'Mochiy Pop One', cursive; }
    .playing-animation {
      animation: bounce 0.5s infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-10px) scale(1.1); text-shadow: 0 0 15px rgba(250, 204, 21, 0.8); }
    }
    .instrument-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .instrument-btn:active { transform: scale(0.95); }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col overflow-x-hidden selection:bg-purple-500 selection:text-white relative">
  
  <!-- 背景装飾 -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-purple-600/20 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-amber-500/20 rounded-full blur-[100px]"></div>
  </div>

  <!-- ヘッダー -->
  <header class="w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 sticky top-0 z-40 flex items-center justify-between">
    <a href="index.html" class="px-3 py-1.5 rounded-xl bg-purple-500/15 hover:bg-purple-500/25 border border-purple-500/30 text-purple-300 text-xs font-bold transition flex items-center gap-1">
      <span>‹</span><span class="hidden sm:inline">ゲームセンター</span><span class="sm:hidden">戻る</span>
    </a>
    <h1 class="font-title text-sm sm:text-lg text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-amber-300">音色探偵</h1>
    <div class="w-16"></div> <!-- バランス用 -->
  </header>

  <main class="flex-1 flex flex-col items-center p-4 sm:p-6 relative z-10 w-full max-w-lg mx-auto">
    
    <!-- タイトル＆ステータス -->
    <div class="text-center mb-6 w-full">
      <div class="flex justify-between items-center mb-2 px-2">
        <span id="levelDisplay" class="px-3 py-1 bg-purple-900/50 border border-purple-500/50 text-purple-300 rounded-full text-xs font-black tracking-wider">LEVEL 1</span>
        <span id="scoreDisplay" class="px-3 py-1 bg-amber-900/50 border border-amber-500/50 text-amber-300 rounded-full text-xs font-black tracking-wider">SCORE: 0</span>
      </div>
      <h2 class="text-2xl font-black mb-1">何の楽器の音？</h2>
      <p class="text-xs text-slate-400">メロディーを聴いて、使われている楽器を当てよう！</p>
    </div>

    <!-- 再生エリア -->
    <div class="w-full bg-slate-900/60 border border-slate-700 rounded-3xl p-8 mb-6 flex flex-col items-center justify-center shadow-xl shadow-purple-900/20">
      <div id="musicIcon" class="text-6xl mb-6 grayscale opacity-50 transition-all duration-300">🎵</div>
      <button id="playBtn" class="px-8 py-4 rounded-2xl bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-400 hover:to-indigo-500 text-white font-title font-black text-xl shadow-lg shadow-purple-500/30 active:scale-95 transition-all flex items-center gap-2">
        <span>▶️</span> メロディーを聴く
      </button>
      <p id="playStatusText" class="text-[10px] text-slate-400 mt-3 h-4">ボタンを押して音声を再生</p>
    </div>

    <!-- 選択肢エリア -->
    <div class="w-full">
      <h3 class="text-center text-sm font-bold text-slate-300 mb-3 border-b border-slate-800 pb-2">楽器の選択肢</h3>
      <div id="choicesContainer" class="grid grid-cols-2 gap-3 sm:gap-4">
        <!-- JSでボタンが生成されます -->
      </div>
    </div>

  </main>

  <!-- 結果発表モーダル -->
  <div id="resultModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border-2 rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl transform transition-all scale-95" id="resultModalBox">
      <div id="resultIcon" class="text-6xl mb-2">⭕</div>
      <h2 id="resultTitle" class="font-title text-3xl font-black mb-2">正解！</h2>
      <p id="resultDesc" class="text-sm font-bold text-slate-300 mb-6">正解は「ピアノ」でした！</p>
      
      <button id="nextBtn" class="w-full py-4 rounded-xl font-black text-lg text-white shadow-lg active:scale-95 transition-all">
        次の問題へ
      </button>
    </div>
  </div>

  <script>
    /* ----------------------------------
       Web Audio API - 楽器の合成エンジン
    ---------------------------------- */
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    const INSTRUMENTS = {
      piano: { name: 'ピアノ', icon: '🎹', color: 'from-zinc-700 to-zinc-900' },
      flute: { name: 'フルート', icon: '🎵', color: 'from-cyan-500 to-blue-600' },
      synth: { name: '8bitシンセ', icon: '👾', color: 'from-pink-500 to-rose-600' },
      organ: { name: 'オルガン', icon: '⛪', color: 'from-amber-600 to-orange-700' },
      bell: { name: 'ベル', icon: '🔔', color: 'from-yellow-400 to-amber-500' },
      brass: { name: 'ブラス', icon: '🎺', color: 'from-orange-400 to-red-500' }
    };

    // 音階(MIDIノート番号)を周波数に変換
    function m2f(note) { return 440 * Math.pow(2, (note - 69) / 12); }

    // 単音を鳴らす関数
    function playTone(instrumentId, note, startTime, duration) {
      const ctx = audioCtx;
      const freq = m2f(note);
      
      if (instrumentId === 'piano') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        // 減衰の早いエンベロープ（ピアノ風のアタック感）
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.8, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(startTime); osc.stop(startTime + duration);
      } 
      else if (instrumentId === 'flute') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        // アタックとリリースが少しゆっくり
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.5, startTime + 0.1);
        gain.gain.setValueAtTime(0.5, startTime + duration - 0.1);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(startTime); osc.stop(startTime + duration);
      }
      else if (instrumentId === 'synth') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        // ファミコン風のプチッとした音
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.15, startTime + 0.05);
        gain.gain.setValueAtTime(0.15, startTime + duration - 0.05);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(startTime); osc.stop(startTime + duration);
      }
      else if (instrumentId === 'organ') {
        // オルガンは基本波＋オクターブ上の音を重ねる
        const freqs = [freq, freq * 2, freq * 3];
        freqs.forEach((f, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = f;
          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(0.2 / (i+1), startTime + 0.05);
          gain.gain.setValueAtTime(0.2 / (i+1), startTime + duration - 0.05);
          gain.gain.linearRampToValueAtTime(0, startTime + duration);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(startTime); osc.stop(startTime + duration);
        });
      }
      else if (instrumentId === 'bell') {
        // ベルは非整数倍音を重ねて急速に減衰させる
        const freqs = [freq, freq * 2.76, freq * 5.4, freq * 8.9];
        freqs.forEach(f => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = f;
          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(0.3, startTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration * 1.5);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(startTime); osc.stop(startTime + duration * 1.5);
        });
      }
      else if (instrumentId === 'brass') {
        // ブラスはノコギリ波＋ローパスフィルターの開閉
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        osc.type = 'sawtooth';
        osc.frequency.value = freq;
        
        filter.type = 'lowpass';
        filter.Q.value = 2;
        // フィルターを時間で閉じる（「パーゥ」という音になる）
        filter.frequency.setValueAtTime(freq * 8, startTime);
        filter.frequency.exponentialRampToValueAtTime(freq, startTime + 0.3);

        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.3, startTime + 0.05);
        gain.gain.setValueAtTime(0.3, startTime + duration - 0.1);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);

        osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
        osc.start(startTime); osc.stop(startTime + duration);
      }
    }

    // メロディー（Cペンタトニックスケール等からランダムなフレーズ）を生成して再生
    let isPlaying = false;
    function playRandomMelody(instrumentId) {
      if (isPlaying) return;
      initAudio();
      isPlaying = true;
      
      const musicIcon = document.getElementById('musicIcon');
      musicIcon.classList.remove('grayscale', 'opacity-50');
      musicIcon.classList.add('playing-animation');
      document.getElementById('playStatusText').textContent = '♪ 再生中...';

      // Cメジャーペンタトニック (C4, D4, E4, G4, A4, C5)
      const scale = [60, 62, 64, 67, 69, 72]; 
      const melodyLength = 5; // 5音フレーズ
      let currentTime = audioCtx.currentTime + 0.1;

      for (let i = 0; i < melodyLength; i++) {
        const note = scale[Math.floor(Math.random() * scale.length)];
        const duration = 0.3; // 1音の長さ
        playTone(instrumentId, note, currentTime, duration);
        currentTime += duration + 0.1; // 音と音の間隔
      }

      // 再生終了後のUI戻し
      setTimeout(() => {
        isPlaying = false;
        musicIcon.classList.add('grayscale', 'opacity-50');
        musicIcon.classList.remove('playing-animation');
        document.getElementById('playStatusText').textContent = 'もう一度聴けます';
      }, (melodyLength * 0.4 + 0.2) * 1000);
    }

    /* ----------------------------------
       ゲームの進行ロジック
    ---------------------------------- */
    const LEVEL_CONFIG = [
      ['piano', 'flute', 'synth'],                          // Lv1: 3択
      ['piano', 'flute', 'synth', 'organ'],                 // Lv2: 4択
      ['piano', 'flute', 'synth', 'organ', 'bell'],         // Lv3: 5択
      ['piano', 'flute', 'synth', 'organ', 'bell', 'brass'] // Lv4: 6択
    ];

    let currentLevel = 1;
    let score = 0;
    let currentAnswer = '';
    let hasPlayedInRound = false;

    const playBtn = document.getElementById('playBtn');
    const choicesContainer = document.getElementById('choicesContainer');
    const resultModal = document.getElementById('resultModal');
    const resultModalBox = document.getElementById('resultModalBox');
    const nextBtn = document.getElementById('nextBtn');

    function startRound() {
      hasPlayedInRound = false;
      document.getElementById('playStatusText').textContent = 'ボタンを押して音声を再生';
      
      // レベルごとの楽器プールを取得（最大レベルは配列の最後）
      const poolIndex = Math.min(currentLevel - 1, LEVEL_CONFIG.length - 1);
      const availableInstruments = LEVEL_CONFIG[poolIndex];
      
      // 正解をランダムに決定
      currentAnswer = availableInstruments[Math.floor(Math.random() * availableInstruments.length)];
      
      // 選択肢UIを生成
      choicesContainer.innerHTML = '';
      availableInstruments.forEach(instId => {
        const instInfo = INSTRUMENTS[instId];
        const btn = document.createElement('button');
        btn.className = `instrument-btn p-4 rounded-2xl bg-gradient-to-b ${instInfo.color} border border-white/10 shadow-lg flex flex-col items-center justify-center opacity-50 cursor-not-allowed`;
        btn.innerHTML = `
          <span class="text-3xl mb-2">${instInfo.icon}</span>
          <span class="text-sm font-bold">${instInfo.name}</span>
        `;
        // 最初はクリック不可（音を聴いてから）
        btn.disabled = true;
        btn.onclick = () => checkAnswer(instId);
        choicesContainer.appendChild(btn);
      });
      
      updateStatus();
    }

    // 再生ボタンクリック
    playBtn.addEventListener('click', () => {
      playRandomMelody(currentAnswer);
      if (!hasPlayedInRound) {
        hasPlayedInRound = true;
        // 音を聴いたら選択肢を有効化
        const btns = choicesContainer.querySelectorAll('.instrument-btn');
        btns.forEach(btn => {
          btn.disabled = false;
          btn.classList.remove('opacity-50', 'cursor-not-allowed');
          btn.classList.add('hover:ring-4', 'hover:ring-white/30');
        });
      }
    });

    // 答え合わせ
    function checkAnswer(selectedId) {
      if (isPlaying) return; // 再生中は判定しない

      const isCorrect = (selectedId === currentAnswer);
      const answerInfo = INSTRUMENTS[currentAnswer];

      const rIcon = document.getElementById('resultIcon');
      const rTitle = document.getElementById('resultTitle');
      const rDesc = document.getElementById('resultDesc');
      
      if (isCorrect) {
        // 正解音
        initAudio();
        playTone('bell', 72, audioCtx.currentTime, 0.5); // C5
        playTone('bell', 76, audioCtx.currentTime + 0.1, 0.5); // E5
        
        score += 100 * currentLevel;
        currentLevel++;
        
        rIcon.textContent = '⭕';
        rTitle.textContent = '大正解！';
        rTitle.className = 'font-title text-3xl font-black mb-2 text-emerald-400';
        rDesc.textContent = `正解は「${answerInfo.icon} ${answerInfo.name}」でした！`;
        resultModalBox.className = 'bg-slate
