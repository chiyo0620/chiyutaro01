<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>じゃんけんバトル ARENA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-title {
      font-family: 'Mochiy Pop One', cursive;
    }
    @keyframes pulse-btn {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(236, 72, 153, 0.6); }
      50% { transform: scale(1.04); box-shadow: 0 0 35px rgba(236, 72, 153, 0.9); }
    }
    .btn-battle-ready {
      animation: pulse-btn 1.4s infinite ease-in-out;
    }
    .rotate-opponent {
      transform: rotate(180deg);
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

  <!-- ==================== ナビゲーションヘッダー ==================== -->
  <header class="p-3 sm:p-4 bg-slate-900/80 border-b border-slate-800 flex items-center justify-between z-20 backdrop-blur-md">
    <a href="index.html" class="flex items-center gap-2 text-xs sm:text-sm font-bold text-pink-400 hover:text-pink-300 transition-colors px-3 py-1.5 rounded-xl bg-pink-500/10 border border-pink-500/20">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      ゲームセンターへ戻る
    </a>
    <div class="font-title text-sm sm:text-lg text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-indigo-400">
      じゃんけんバトル ARENA
    </div>
    <button id="btn-open-settings" class="text-xs sm:text-sm text-slate-400 hover:text-white px-3 py-1.5 rounded-xl bg-slate-800 border border-slate-700">
      設定変更
    </button>
  </header>

  <!-- ==================== 設定画面（モーダル / 初期表示） ==================== -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-950/95 z-50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-slate-900 border-2 border-pink-500/40 rounded-3xl p-6 sm:p-8 max-w-lg w-full shadow-[0_0_50px_rgba(236,72,153,0.2)] my-auto">
      <div class="text-center mb-6">
        <span class="text-3xl">✊✌️🖐️</span>
        <h2 class="font-title text-2xl sm:text-3xl font-black text-pink-400 mt-2">バトル設定</h2>
        <p class="text-slate-400 text-xs mt-1">ルールとお好みの対戦スタイルを選んでください</p>
      </div>

      <!-- 対戦モード -->
      <div class="mb-5">
        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">対戦モード</label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" class="mode-select-btn active-opt py-2.5 px-3 rounded-xl border font-bold text-sm" data-type="mode" data-val="com">
            🤖 VS COM (1人)
          </button>
          <button type="button" class="mode-select-btn inactive-opt py-2.5 px-3 rounded-xl border font-bold text-sm" data-type="mode" data-val="2p">
            👥 2人対戦
          </button>
        </div>
      </div>

      <!-- COM 難易度 (COM時のみ) -->
      <div id="com-diff-group" class="mb-5">
        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">COMの強さ</label>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" class="diff-btn inactive-opt py-2 px-2 rounded-xl border text-xs font-bold" data-val="easy">Easy (お調子者)</button>
          <button type="button" class="diff-btn active-opt py-2 px-2 rounded-xl border text-xs font-bold" data-val="normal">Normal (気まぐれ)</button>
          <button type="button" class="diff-btn inactive-opt py-2 px-2 rounded-xl border text-xs font-bold" data-val="hard">Hard (心理戦AI)</button>
        </div>
      </div>

      <!-- 2人プレイ方式 (2P時のみ) -->
      <div id="p2-style-group" class="mb-5 hidden">
        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">2人の操作スタイル</label>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" class="p2-style-btn active-opt py-2 px-2 rounded-xl border text-xs font-bold" data-val="pass">
            🤝 パス＆プレイ<br><span class="text-[10px] text-slate-400">スマホ交代</span>
          </button>
          <button type="button" class="p2-style-btn inactive-opt py-2 px-2 rounded-xl border text-xs font-bold" data-val="face">
            📱 対面タップ<br><span class="text-[10px] text-slate-400">上下向かい合い</span>
          </button>
          <button type="button" class="p2-style-btn inactive-opt py-2 px-2 rounded-xl border text-xs font-bold" data-val="key">
            ⌨️ 同時キー<br><span class="text-[10px] text-slate-400">PC（A/S/DとJ/K/L）</span>
          </button>
        </div>
      </div>

      <!-- 勝負形式 -->
      <div class="mb-5">
        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">勝負ルール</label>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" class="rule-btn inactive-opt py-2 px-2 rounded-xl border text-xs font-bold" data-val="single">1回勝負</button>
          <button type="button" class="rule-btn inactive-opt py-2 px-2 rounded-xl border text-xs font-bold" data-val="best3">3本先取</button>
          <button type="button" class="rule-btn active-opt py-2 px-2 rounded-xl border text-xs font-bold" data-val="hp">HPバトル (体力3)</button>
        </div>
      </div>

      <!-- 特殊オプション -->
      <div class="mb-6 space-y-2.5">
        <label class="flex items-center gap-3 p-3 bg-slate-800/60 rounded-xl border border-slate-700/60 cursor-pointer hover:bg-slate-800">
          <input type="checkbox" id="check-stock" class="w-4 h-4 rounded text-pink-500 accent-pink-500">
          <div>
            <span class="text-sm font-bold text-slate-200">🃏 手札制限ルール</span>
            <p class="text-[11px] text-slate-400 leading-tight">グー・チョキ・パー各2枚ずつ所持。使い切るまで同じ手を連発不可</p>
          </div>
        </label>
        <label class="flex items-center gap-3 p-3 bg-slate-800/60 rounded-xl border border-slate-700/60 cursor-pointer hover:bg-slate-800">
          <input type="checkbox" id="check-skill" class="w-4 h-4 rounded text-pink-500 accent-pink-500">
          <div>
            <span class="text-sm font-bold text-slate-200">⚡ 必殺技スキル（1回限り）</span>
            <p class="text-[11px] text-slate-400 leading-tight">「シールド（あいこでも勝ち）」や「クリティカル（2倍効果）」を発動可能</p>
          </div>
        </label>
      </div>

      <button id="btn-start-game" class="w-full py-4 rounded-2xl bg-gradient-to-r from-pink-500 via-rose-500 to-indigo-600 font-title font-black text-lg text-white shadow-lg shadow-pink-500/30 hover:opacity-95 active:scale-[0.98] transition-all">
        ゲーム開始！
      </button>
    </div>
  </div>

  <!-- ==================== 対戦メイン画面 ==================== -->
  <main id="battle-field" class="flex-1 flex flex-col justify-between max-w-xl w-full mx-auto p-4 relative overflow-hidden">

    <!-- プレイヤー2 / COM 側ステータス -->
    <div id="p2-board" class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 transition-all">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <span class="text-xl" id="p2-avatar">🤖</span>
          <span class="font-bold text-sm" id="p2-name">COM</span>
        </div>
        <!-- HP または 勝ち星 -->
        <div id="p2-score-box" class="flex items-center gap-1 font-mono font-bold text-sm">
          <!-- JSで描画 -->
        </div>
      </div>

      <!-- 残り手札（手札制時） -->
      <div id="p2-stock-box" class="flex gap-2 text-xs text-slate-400 mb-1 hidden">
        <span>✊ <b id="p2-stock-rock" class="text-white">2</b></span>
        <span>✌️ <b id="p2-stock-scissors" class="text-white">2</b></span>
        <span>🖐️ <b id="p2-stock-paper" class="text-white">2</b></span>
      </div>

      <!-- 2P対面タップ用ボタン群（対面モード時のみ表示＆180度反転） -->
      <div id="p2-face-controls" class="hidden rotate-opponent pt-2">
        <div class="text-[10px] text-center text-slate-400 mb-1 font-bold">Player 2（上側からタップ）</div>
        <div class="grid grid-cols-3 gap-2">
          <button class="face-p2-btn p-3 rounded-xl bg-slate-800 border border-slate-700 text-2xl active:bg-pink-600" data-hand="rock">✊</button>
          <button class="face-p2-btn p-3 rounded-xl bg-slate-800 border border-slate-700 text-2xl active:bg-pink-600" data-hand="scissors">✌️</button>
          <button class="face-p2-btn p-3 rounded-xl bg-slate-800 border border-slate-700 text-2xl active:bg-pink-600" data-hand="paper">🖐️</button>
        </div>
        <div id="p2-face-status" class="text-center text-xs font-bold text-pink-400 mt-1">手を選んでください</div>
      </div>
    </div>

    <!-- 中央アリーナ（じゃんけん・ぽん！＆判定演出） -->
    <div class="my-auto py-6 flex flex-col items-center justify-center relative min-h-[220px]">
      
      <!-- カウントダウン / アナウンス -->
      <div id="arena-announcement" class="text-center mb-4 min-h-[40px] flex items-center justify-center">
        <span class="font-title text-2xl sm:text-3xl font-black text-pink-300 drop-shadow">手を選んでください</span>
      </div>

      <!-- 出された手オープンエリア -->
      <div class="flex items-center justify-center gap-8 sm:gap-14 my-2">
        <!-- P1 手 -->
        <div class="flex flex-col items-center">
          <div id="p1-hand-display" class="w-20 h-20 sm:w-24 sm:h-24 rounded-3xl bg-slate-900 border-2 border-indigo-500/50 flex items-center justify-center text-4xl sm:text-5xl shadow-lg transition-transform">
            ❓
          </div>
          <span class="text-xs font-bold text-indigo-400 mt-2" id="p1-hand-label">P1</span>
        </div>

        <div class="font-title text-2xl font-black text-slate-500">VS</div>

        <!-- P2 手 -->
        <div class="flex flex-col items-center">
          <div id="p2-hand-display" class="w-20 h-20 sm:w-24 sm:h-24 rounded-3xl bg-slate-900 border-2 border-pink-500/50 flex items-center justify-center text-4xl sm:text-5xl shadow-lg transition-transform">
            ❓
          </div>
          <span class="text-xs font-bold text-pink-400 mt-2" id="p2-hand-label">COM</span>
        </div>
      </div>

      <!-- 🔥 パス＆プレイ用「いざ、勝負！！」ボタン -->
      <div id="battle-fire-wrapper" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm rounded-3xl flex items-center justify-center hidden z-30">
        <button id="btn-fire-battle" class="btn-battle-ready px-8 py-5 rounded-2xl bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 text-white font-title font-black text-2xl shadow-2xl active:scale-95 transition-transform flex items-center gap-3">
          <span>🔥</span> いざ、勝負！！ <span>🔥</span>
        </button>
      </div>

      <!-- 次のラウンドへボタン -->
      <div id="next-round-wrapper" class="mt-4 hidden z-20">
        <button id="btn-next-round" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-sm text-white shadow-lg active:scale-95 transition-all">
          次の勝負へ ➔
        </button>
      </div>
    </div>

    <!-- プレイヤー1 側ステータス＆操作パネル -->
    <div id="p1-board" class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <span class="text-xl">😎</span>
          <span class="font-bold text-sm" id="p1-name">あなた (P1)</span>
        </div>
        <div id="p1-score-box" class="flex items-center gap-1 font-mono font-bold text-sm">
          <!-- JSで描画 -->
        </div>
      </div>

      <!-- 残り手札（手札制時） -->
      <div id="p1-stock-box" class="flex gap-2 text-xs text-slate-400 mb-2 hidden">
        <span>✊ <b id="p1-stock-rock" class="text-white">2</b></span>
        <span>✌️ <b id="p1-stock-scissors" class="text-white">2</b></span>
        <span>🖐️ <b id="p1-stock-paper" class="text-white">2</b></span>
      </div>

      <!-- 必殺技スキル発動バー -->
      <div id="p1-skill-box" class="mb-2 hidden flex gap-2">
        <button id="btn-skill-shield" class="skill-btn flex-1 py-1 px-2 rounded-lg bg-emerald-950/60 border border-emerald-500/40 text-[11px] font-bold text-emerald-300 active:scale-95">
          🛡️ シールド (あいこ勝ち)
        </button>
        <button id="btn-skill-crit" class="skill-btn flex-1 py-1 px-2 rounded-lg bg-amber-950/60 border border-amber-500/40 text-[11px] font-bold text-amber-300 active:scale-95">
          ⚡ クリティカル (2倍)
        </button>
      </div>

      <!-- 手の選択ボタン（通常／P1用） -->
      <div id="p1-hand-buttons" class="grid grid-cols-3 gap-3">
        <button class="p1-select-btn p-4 rounded-2xl bg-slate-800 hover:bg-slate-700/80 active:bg-pink-600 border border-slate-700 flex flex-col items-center transition-all group disabled:opacity-40" data-hand="rock">
          <span class="text-3xl sm:text-4xl group-hover:scale-110 transition-transform">✊</span>
          <span class="text-xs font-bold text-slate-300 mt-1">グー</span>
          <span class="key-hint text-[10px] text-slate-500 mt-0.5 hidden">[A]</span>
        </button>
        <button class="p1-select-btn p-4 rounded-2xl bg-slate-800 hover:bg-slate-700/80 active:bg-pink-600 border border-slate-700 flex flex-col items-center transition-all group disabled:opacity-40" data-hand="scissors">
          <span class="text-3
