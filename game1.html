<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- iOS Safariでのズームやアドレスバー連動の崩れを防止 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>完璧な円を描け！ - Perfect Circle</title>
  
  <style>
    /* リセットとiOSタッチ挙動の最適化 */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    :root {
      --bg-dark: #0f172a;
      --cyan-bright: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.45);
      --slate-border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
    }

    /* 背景グリッド */
    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(30, 41, 59, 0.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 41, 59, 0.35) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom)) 16px;
      z-index: 10;
    }

    /* ヘッダーエリア */
    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--slate-border);
      border-radius: 20px;
      padding: 8px 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      gap: 8px;
    }

    .back-portal-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.35);
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s ease;
    }
    .back-portal-btn:active {
      background: rgba(6, 182, 212, 0.25);
    }

    .title-box {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }

    .title-box h1 {
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .best-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .best-label {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .best-val {
      font-size: 0.9rem;
      font-weight: 800;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
    }

    /* キャンバスコンテナ */
    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--slate-border);
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 25px var(--cyan-glow);
      overflow: hidden;
      touch-action: none;
    }

    #drawCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
    }

    /* 初期ガイド表示 */
    #guideLayer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.3s ease;
    }

    .guide-circle {
      width: 62%;
      height: 62%;
      border-radius: 50%;
      border: 2px dashed rgba(56, 189, 248, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulseGuide 3s infinite ease-in-out;
      position: relative;
    }

    .center-cross {
      width: 10px;
      height: 10px;
      position: relative;
    }
    .center-cross::before, .center-cross::after {
      content: '';
      position: absolute;
      background: rgba(56, 189, 248, 0.6);
    }
    .center-cross::before {
      top: 4px; left: -6px; width: 22px; height: 2px;
    }
    .center-cross::after {
      top: -6px; left: 4px; width: 2px; height: 22px;
    }

    @keyframes pulseGuide {
      0%, 100% { transform: scale(1); border-color: rgba(56, 189, 248, 0.3); }
      50% { transform: scale(1.04); border-color: rgba(56, 189, 248, 0.7); }
    }

    .guide-text {
      margin-top: 14px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      text-align: center;
      line-height: 1.4;
    }

    /* 判定結果カード（モーダル） */
    #resultModal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #resultModal.show {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .score-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
    }

    .score-display {
      font-size: 4rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 30%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .rank-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 8px;
    }

    .feedback-msg {
      font-size: 0.82rem;
      color: #94a3b8;
      text-align: center;
      line-height: 1.4;
      margin-bottom: 18px;
      padding: 0 10px;
    }

    .modal-btn-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 12px 8px;
      border-radius: 14px;
      border: none;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      transition: transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.96);
    }

    .btn-main {
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
    }

    .btn-sub {
      background: rgba(30, 41, 59, 0.85);
      color: #cbd5e1;
      border: 1px solid var(--slate-border);
    }

    /* トースト通知 */
    #toast {
      position: absolute;
      top: max(80px, calc(env(safe-area-inset-top) + 60px));
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #0284c7;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 999px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    footer {
      font-size: 0.72rem;
      color: #475569;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="grid-pattern"></div>
  <div id="toast"><span>✓</span><span id="toastMsg">コピーしました</span></div>

  <div id="app">
    <!-- ヘッダー（戻るボタン付き） -->
    <header>
      <a href="index.html" class="back-portal-btn">
        <span>‹</span> ゲームセンター
      </a>
      <div class="title-box">
        <span>⭕</span>
        <h1>円を描け！</h1>
      </div>
      <div class="best-badge">
        <span class="best-label">ベスト</span>
        <span id="bestScoreEl" class="best-val">0.0%</span>
      </div>
    </header>

    <!-- 描画エリア -->
    <div class="canvas-container" id="canvasBox">
      <canvas id="drawCanvas"></canvas>

      <div id="guideLayer">
        <div class="guide-circle">
          <div class="center-cross"></div>
        </div>
        <p class="guide-text">
          画面を指でぐるっと一周！<br>
          <span style="font-size: 0.72rem; color: #64748b;">指を離すと真円度を採点します</span>
        </p>
      </div>

      <!-- 判定結果モーダル -->
      <div id="resultModal">
        <div class="score-badge">真円測定スコア</div>
        <div id="scoreValEl" class="score-display">0.0%</div>
        <div id="rankNameEl" class="rank-name">測定中...</div>
        <div id="feedbackEl" class="feedback-msg">指を離すと判定されます</div>
        
        <div class="modal-btn-row">
          <button id="retryBtn" class="btn btn-main">
            <span>🔄</span> もう一度
          </button>
          <button id="shareBtn" class="btn btn-sub">
            <span>📋</span> コピー
          </button>
          <a href="index.html" class="btn btn-sub">
            <span>🏠</span> センター
          </a>
        </div>
      </div>
    </div>

    <footer>
      画面を1本の指でなぞって一筆書きしてください
    </footer>
  </div>

  <script>
    let audioCtx = null;
    function initAudioOnFirstTouch() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type = 'sine', duration = 0.08, vol = 0.08) {
      try {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const canvasBox = document.getElementById('canvasBox');
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    const guideLayer = document.getElementById('guideLayer');
    const resultModal = document.getElementById('resultModal');
    const scoreValEl = document.getElementById('scoreValEl');
    const rankNameEl = document.getElementById('rankNameEl');
    const feedbackEl = document.getElementById('feedbackEl');
    const bestScoreEl = document.getElementById('bestScoreEl');
    const retryBtn = document.getElementById('retryBtn');
    const shareBtn = document.getElementById('shareBtn');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');

    let bestScore = 0.0;
    try {
      const saved = localStorage.getItem('circle_best_score');
      if (saved) {
        bestScore = parseFloat(saved) || 0.0;
        bestScoreEl.textContent = bestScore.toFixed(1) + '%';
      }
    } catch (e) {}

    let dpr = 1, canvasW = 0, canvasH = 0;

    function resizeCanvas() {
      const rect = canvasBox.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      canvasW = rect.width;
      canvasH = rect.height;

      canvas.width = canvasW * dpr;
      canvas.height = canvasH * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }

    window.addEventListener('resize', resizeCanvas);

    let isDrawing = false;
    let points = [];
    let isFinished = false;
    let lastPoint = null;

    function getLocalPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top,
        t: performance.now()
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      initAudioOnFirstTouch();
      if (isFinished) return;

      isDrawing = true;
      points = [];
      const pt = getLocalPos(e);
      points.push(pt);
      lastPoint = pt;

      guideLayer.style.opacity = '0';
      ctx.clearRect(0, 0, canvasW, canvasH);

      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = '#06b6d4';
      ctx.shadowColor = '#06b6d4';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;

      playTone(480, 'sine', 0.05, 0.05);
    }, { passive: false });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing || isFinished) return;
      e.preventDefault();

      const pt = getLocalPos(e);
      const dx = pt.x - lastPoint.x;
      const dy = pt.y - lastPoint.y;
      const dist = Math.hypot(dx, dy);

      if (dist < 2.5) return;
      points.push(pt);

      ctx.beginPath();
      ctx.moveTo(lastPoint.x, lastPoint.y);
      ctx.lineTo(pt.x, pt.y);
      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = '#06b6d4';
      ctx.shadowBlur = 8;
      ctx.stroke();
      ctx.shadowBlur = 0;

      if (points.length % 6 === 0) {
        playTone(320 + Math.min(dist * 12, 400), 'triangle', 0.03, 0.03);
      }
      lastPoint = pt;
    }, { passive: false });

    const onPointerEnd = (e) => {
      if (!isDrawing || isFinished) return;
      e.preventDefault();
      isDrawing = false;

      if (points.length < 20) {
        guideLayer.style.opacity = '1';
        ctx.clearRect(0, 0, canvasW, canvasH);
        return;
      }
      analyzeCircle();
    };

    canvas.addEventListener('pointerup', onPointerEnd, { passive: false });
    canvas.addEventListener('pointercancel', onPointerEnd, { passive: false });

    function analyzeCircle() {
      isFinished = true;
      const n = points.length;
      let sumX = 0, sumY = 0;
      for (let i = 0; i < n; i++) {
        sumX += points[i].x; sumY += points[i].y;
      }
      const cx = sumX / n, cy = sumY / n;

      let radii = [], sumR = 0;
      for (let i = 0; i < n; i++) {
        const r = Math.hypot(points[i].x - cx, points[i].y - cy);
        radii.push(r);
        sumR += r;
      }
      const avgR = sumR / n;

      if (avgR < 25) {
        showResultModal(0.0, '小さすぎます', 'もっと大きく画面いっぱいに描いてね！');
        return;
      }

      let varSum = 0;
      for (let i = 0; i < n; i++) {
        varSum += Math.pow(radii[i] - avgR, 2);
      }
      const stdDev = Math.sqrt(varSum / n);
      const cv = stdDev / avgR;

      let totalAngle = 0;
      let prevAngle = Math.atan2(points[0].y - cy, points[0].x - cx);
      for (let i = 1; i < n; i++) {
        const currentAngle = Math.atan2(points[i].y - cy, points[i].x - cx);
        let diff = currentAngle - prevAngle;
        while (diff > Math.PI) diff -= 2 * Math.PI;
        while (diff < -Math.PI) diff += 2 * Math.PI;
        totalAngle += diff;
        prevAngle = currentAngle;
      }
      const turns = Math.abs(totalAngle) / (2 * Math.PI);

      const startPt = points[0];
      const endPt = points[n - 1];
      const gapRatio = Math.hypot(endPt.x - startPt.x, endPt.y - startPt.y) / avgR;

      let score = 0, rank = '', feedback = '';

      if (turns < 0.72) {
        score = Math.max(5.0, turns * 40);
        rank = '未完成 ❌';
        feedback = '途中で切れています。最後まで円を閉じよう！';
      } else if (turns > 1.35) {
        score = Math.max(15.0, 75 - (turns - 1.35) * 60);
        rank = 'ぐるぐる巻き 🌀';
        feedback = '線を重ねすぎです。サッと一筆で描いてみて！';
      } else {
        const shapeScore = Math.max(0, 100 * (1 - cv * 3.4));
        const closeScore = Math.max(0, 100 * (1 - gapRatio * 0.85));
        score = shapeScore * 0.75 + closeScore * 0.25;
        score = Math.min(99.6, Math.max(10.0, score));

        if (score >= 95.0) {
          rank = '神の御手 👑';
          feedback = '信じられない精度！人間コンパス認定です！';
        } else if (score >= 90.0) {
          rank = '職人級 ✨';
          feedback = '美しい真円！指先の研ぎ澄まされ方が凄いです！';
        } else if (score >= 82.0) {
          rank = '達人級 👍';
          feedback = 'とても綺麗！90%台まであと一歩の丸です！';
        } else if (score >= 70.0) {
          rank = 'たまご型 🥚';
          feedback = '少し楕円気味かも？力を抜いて丸く回そう！';
        } else {
          rank = 'いびつな形 🥔';
          feedback = '手首を固定して、肘を軸にして回すと描きやすいよ！';
        }
      }

      drawIdealCircleOverlay(cx, cy, avgR);
      setTimeout(() => {
        showResultModal(score, rank, feedback);
      }, 350);
    }

    function drawIdealCircleOverlay(cx, cy, r) {
      ctx.beginPath();
      ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([5, 5]);
      ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
      ctx.shadowBlur = 6;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.shadowBlur = 0;
    }

    function showResultModal(score, rank, feedback) {
      scoreValEl.textContent = score.toFixed(1) + '%';
      rankNameEl.textContent = rank;
      feedbackEl.textContent = feedback;
      resultModal.classList.add('show');

      if (score > bestScore) {
        bestScore = score;
        bestScoreEl.textContent = bestScore.toFixed(1) + '%';
        try {
          localStorage.setItem('circle_best_score', bestScore.toString());
        } catch (e) {}
      }

      if (score >= 90.0) {
        playTone(523, 'sine', 0.12, 0.1);
        setTimeout(() => playTone(659, 'sine', 0.12, 0.1), 100);
        setTimeout(() => playTone(784, 'sine', 0.25, 0.12), 200);
      } else if (score >= 70.0) {
        playTone(440, 'triangle', 0.15, 0.08);
      } else {
        playTone(260, 'sawtooth', 0.2, 0.06);
      }
    }

    retryBtn.addEventListener('click', () => {
      initAudioOnFirstTouch();
      resultModal.classList.remove('show');
      guideLayer.style.opacity = '1';
      ctx.clearRect(0, 0, canvasW, canvasH);
      isFinished = false;
      isDrawing = false;
      points = [];
      playTone(400, 'sine', 0.05, 0.05);
    });

    shareBtn.addEventListener('click', () => {
      initAudioOnFirstTouch();
      const score = scoreValEl.textContent;
      const rank = rankNameEl.textContent;
      const text = `⭕『完璧な円を描け！』で【${score} (${rank})】を記録！\n挑戦してみてね！`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('コピーしました！'));
      }
    });

    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    window.addEventListener('DOMContentLoaded', resizeCanvas);
  </script>
</body>
</html>
